<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="50%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#0d0d35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff006e"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#hero-bg)"/>
  
  <!-- Ambient orbs -->
  <circle cx="200" cy="150" r="180" fill="url(#orb1)"/>
  <circle cx="900" cy="100" r="150" fill="url(#orb2)"/>
  <circle cx="600" cy="250" r="120" fill="url(#orb1)" opacity="0.5"/>
  
  <!-- Constellation dots -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="100" cy="50" r="1.5"/>
    <circle cx="250" cy="80" r="1"/>
    <circle cx="350" cy="30" r="1.5"/>
    <circle cx="500" cy="60" r="1"/>
    <circle cx="650" cy="40" r="1.5"/>
    <circle cx="800" cy="70" r="1"/>
    <circle cx="950" cy="45" r="1.5"/>
    <circle cx="1100" cy="55" r="1"/>
    <circle cx="150" cy="250" r="1"/>
    <circle cx="400" cy="270" r="1.5"/>
    <circle cx="700" cy="260" r="1"/>
    <circle cx="1050" cy="240" r="1.5"/>
  </g>
  
  <!-- Network connections -->
  <g stroke="#7b2ff7" stroke-width="0.5" opacity="0.2">
    <line x1="100" y1="50" x2="250" y2="80"/>
    <line x1="250" y1="80" x2="350" y2="30"/>
    <line x1="500" y1="60" x2="650" y2="40"/>
    <line x1="650" y1="40" x2="800" y2="70"/>
    <line x1="800" y1="70" x2="950" y2="45"/>
  </g>
  
  <!-- Central Delta Symbol -->
  <g transform="translate(540, 80)">
    <polygon points="60,0 120,110 0,110" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#blur-glow)"/>
    <polygon points="60,0 120,110 0,110" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="60" y="85" font-family="monospace" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.9">⌬</text>
  </g>
  
  <!-- Title text -->
  <text x="600" y="240" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="8" opacity="0.95">PEGASUS BATTLEOPS</text>
  <text x="600" y="275" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#6b7280" text-anchor="middle" letter-spacing="3">AUTONOMOUS INTELLIGENCE · LIVING DEFENSE · COMPRESSED MEANING</text>
  
  <!-- Accent line bottom -->
  <rect x="350" y="290" width="500" height="1" fill="url(#accent)" opacity="0.4"/>
</svg>
