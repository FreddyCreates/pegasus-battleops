<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff006e"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0ff"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>
  
  <!-- Pegasus Wing Symbol -->
  <g transform="translate(60, 40)" filter="url(#glow-filter)">
    <!-- Wing shape -->
    <path d="M 20 100 Q 40 20, 80 30 Q 100 35, 110 60 Q 115 75, 105 90 Q 95 100, 80 105 Q 60 110, 40 108 Z" 
          fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.9"/>
    <path d="M 30 95 Q 45 40, 75 45 Q 90 48, 98 65 Q 102 78, 95 88 Q 85 95, 72 98 Q 55 100, 40 98 Z" 
          fill="url(#glow)" opacity="0.15"/>
    <!-- Delta glyph ⌬ -->
    <text x="55" y="82" font-family="monospace" font-size="32" fill="url(#glow)" text-anchor="middle" font-weight="bold">⌬</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="85" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="url(#text-grad)" letter-spacing="2">PEGASUS</text>
  <text x="430" y="85" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="300" fill="#8888cc" letter-spacing="2">BATTLEOPS</text>
  
  <!-- Subtitle -->
  <text x="200" y="120" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#6b7280" letter-spacing="4">SPATIUM COMPUTATIONIS — AUTONOMOUS INTELLIGENCE PLATFORM</text>
  
  <!-- Accent line -->
  <rect x="200" y="135" width="460" height="1.5" fill="url(#glow)" opacity="0.6" rx="1"/>
  
  <!-- Tagline -->
  <text x="200" y="165" font-family="'SF Pro Text', -apple-system, sans-serif" font-size="13" fill="#9ca3af" letter-spacing="1">21 Agents · 53 Protocols · Real-Time Defense · Living Organism Architecture</text>
</svg>
