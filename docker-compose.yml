services:
  spatium-computationis:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NOVA_SOVEREIGN_URL=${NOVA_SOVEREIGN_URL}
      - NOVA_SOVEREIGN_TOKEN=${NOVA_SOVEREIGN_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
